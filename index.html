<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>نداء الصلاة | نظام التحديثات</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; box-sizing: border-box;
      background: #0b1220; color: #f5f7fb;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main {
      width: min(620px, 100%); box-sizing: border-box; padding: 32px;
      border: 1px solid #26354b; border-radius: 22px;
      background: #121d2e; box-shadow: 0 20px 60px #0005;
    }
    .icon { font-size: 42px; }
    h1 { margin: 12px 0; font-size: clamp(25px, 5vw, 36px); }
    p { color: #c4cede; line-height: 1.9; }
    code { direction: ltr; display: block; overflow-wrap: anywhere;
      padding: 14px; margin-top: 18px; border-radius: 12px;
      background: #08111e; color: #9ed5ff; text-align: left; }
    .note { font-size: 13px; color: #8fa2bb; }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">🕌</div>
    <h1>نداء الصلاة</h1>
    <p>هذه صفحة نظام التحديثات الخاص بتطبيق نداء الصلاة. يقرأ التطبيق ملف معلومات الإصدار للتحقق من توفر تحديث جديد.</p>
    <p>ملف معلومات التحديثات:</p>
    <code>version.json</code>
    <p class="note">هذه الصفحة مخصصة لخدمة التطبيق، وليست صفحة تنزيل التطبيق.</p>
  </main>
</body>
</html>
